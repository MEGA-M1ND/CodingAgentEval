name: CI/CD

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit and integration tests
        run: pytest -q
      - name: Deterministic safety baseline
        run: |
          python scripts/run_all.py experiments/baseline-validation.yaml
          python scripts/run_all.py experiments/baseline-validation.yaml --agent manual-unsafe
          python scripts/summarize_results.py results/baseline-validation
      - name: Build distribution
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Publish validation and package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coding-safety-eval-${{ github.sha }}
          path: |
            dist/
            results/baseline-validation/
            trajectories/baseline-validation/
